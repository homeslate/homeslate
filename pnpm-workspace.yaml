catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  typescript: ^6.0.0
overrides:
  vite@*: "catalog:"
  docs>vite: "npm:vite@^6.4.1"
  astro>vite: "npm:vite@^6.4.1"
  "@typestyles/vite>vite": "npm:vite@^6.4.1"
peerDependencyRules:
