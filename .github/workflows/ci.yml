name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: "22"
          cache: true
      - run: vp install
      - run: vp check
      - run: vp run build
      - run: vp test
