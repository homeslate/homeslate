name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only supersede PR runs. A newer push to main must never cancel a run that is
  # about to release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - '.nvmrc'
              - 'netlify.toml'
              - '.github/workflows/ci.yml'

  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .nvmrc
          cache: true

      - run: vp run ci

      # `vp run ci` builds every package. Hand the dist to the release job so
      # publishing does not compile again.
      - name: Pack package dist artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for dir in packages/*; do
            if [ ! -d "$dir/dist" ]; then
              echo "Missing dist for $dir"
              exit 1
            fi
          done
          tar -czf package-dist.tar.gz packages/*/dist

      - name: Upload package dist artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: package-dist
          path: package-dist.tar.gz
          retention-days: 1
          if-no-files-found: error

  release:
    name: Release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: homeslate-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # A GitHub App token (not GITHUB_TOKEN) so the version PR and the tags the
      # release pushes trigger workflows.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # Do not set registry-url on setup-vp: it writes a placeholder _authToken
      # line that blocks npm Trusted Publishing (OIDC).
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .nvmrc
          cache: true

      # Trusted Publishing needs npm >= 11.5.1. Do not use npm@latest: npm 12
      # rejects --git-checks, which pnpm forwards when changeset publish runs.
      - name: Use npm compatible with pnpm publish
        run: npm install -g 'npm@^11.5.1'

      - uses: actions/download-artifact@v8
        with:
          name: package-dist

      - name: Restore package dist artifacts
        run: |
          tar -xzf package-dist.tar.gz
          rm package-dist.tar.gz
          for dir in packages/*; do
            if [ ! -d "$dir/dist" ]; then
              echo "Missing restored dist for $dir"
              exit 1
            fi
          done

      - uses: changesets/action@v1
        with:
          publish: vp exec changeset publish
          version: vp exec changeset version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  deploy-docs:
    name: Deploy docs
    needs: [changes, verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .nvmrc
          cache: true

      - name: Build docs
        run: vp run docs#build

      - name: Deploy to Netlify
        run: npx netlify-cli@24 deploy --prod --filter docs --dir=docs/dist --no-build --message "Deploy from ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  preview-docs:
    name: Preview docs
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .nvmrc
          cache: true

      - name: Build docs
        run: vp run docs#build

      - name: Deploy preview to Netlify
        id: deploy
        run: |
          npx netlify-cli@24 deploy \
            --filter docs \
            --dir=docs/dist \
            --no-build \
            --alias=deploy-preview-${{ github.event.pull_request.number }} \
            --message "PR #${{ github.event.pull_request.number }}: ${{ github.sha }}" \
            --json > deploy.json
          echo "url=$(jq -r '.deploy_url' deploy.json)" >> "$GITHUB_OUTPUT"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- docs-preview-comment -->';
            const body = [
              marker,
              '### Docs preview',
              '',
              `🚀 [Open preview](${process.env.PREVIEW_URL})`,
              '',
              `Commit: \`${context.sha.slice(0, 7)}\``,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
